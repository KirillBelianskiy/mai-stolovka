[project]
name = "mai-user-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_service"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.15,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL test database"]
