[project]
name = "mai-notification-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "uvicorn>=0.34,<1",
  "aiokafka>=0.12,<1",
  "aiogram>=3,<4",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "jsonschema[format]>=4.23,<5"
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.15,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL and Kafka"]
