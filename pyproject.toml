[project]
name = "mai-stolovka"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = ["jsonschema[format]>=4.23,<5", "ruff>=0.9,<1"]
