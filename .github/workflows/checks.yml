name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, menu-service, order-service, notification-service, websocket-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest
      - run: docker build -t mai-${{ matrix.service }}:ci .
      - name: Verify standalone Outbox runtime and bundled schema
        if: matrix.service == 'order-service'
        run: >-
          docker run --rm --entrypoint /app/.venv/bin/python mai-order-service:ci
          -c 'import order_service.outbox; import json; from importlib.resources import files;
          assert json.loads(files("order_service").joinpath("resources/events-v1.json").read_text())["$id"] == "urn:mai-food:events:envelope:1"'
      - name: Verify standalone inbox runtime and bundled schema
        if: matrix.service == 'notification-service'
        run: >-
          docker run --rm --entrypoint /app/.venv/bin/python mai-notification-service:ci
          -c 'import notification_service.ingest; import json; from importlib.resources import files;
          assert json.loads(files("notification_service").joinpath("resources/events-v1.json").read_text())["$id"] == "urn:mai-food:events:envelope:1"'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check infra tests
      - run: uv run --frozen python -m unittest discover -s tests/contracts -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: python infra/create-local-env.py
      - run: python infra/create-auth-env.py
      - run: docker compose config --quiet
      - name: Validate production Compose model
        env:
          PROD_KITCHEN_CIDRS: 127.0.0.1/32
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.prod.yml
          --profile outbox --profile inbox --profile telegram config --quiet
      - run: docker compose up --build --wait --wait-timeout 300
      - name: Validate production Caddyfile
        run: |
          docker run --rm \
            -e PROD_KITCHEN_CIDRS=127.0.0.1/32 -e PROD_WEBHOOK_ENABLED=true \
            -v "$PWD/infra/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/infra/caddy/routes.caddy:/etc/caddy/routes.caddy:ro" \
            "$(docker compose images -q proxy)" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: uv sync --frozen --project services/user-service
      - run: uv sync --frozen --project services/menu-service
      - run: uv sync --frozen --project services/order-service
      - run: uv sync --frozen --project services/notification-service
      - run: python infra/run-service-integration.py
      - run: python -m unittest discover -s tests/smoke -v
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise isolated production routes with local TLS and fake Telegram
        run: python tests/e2e/production_release.py --output "$RUNNER_TEMP/production-release.json"
      - name: Upload sanitized exact-revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: ${{ runner.temp }}/production-release.json
          if-no-files-found: error
