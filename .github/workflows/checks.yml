name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, menu-service, order-service, notification-service, websocket-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest
      - run: docker build -t mai-${{ matrix.service }}:ci .
      - name: Verify standalone Outbox runtime and bundled schema
        if: matrix.service == 'order-service'
        run: >-
          docker run --rm --entrypoint /app/.venv/bin/python mai-order-service:ci
          -c 'import order_service.outbox; import json; from importlib.resources import files;
          assert json.loads(files("order_service").joinpath("resources/events-v1.json").read_text())["$id"] == "urn:mai-food:events:envelope:1"'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check infra tests
      - run: uv run --frozen python -m unittest discover -s tests/contracts -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: python infra/create-local-env.py
      - run: python infra/create-auth-env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 300
      - run: uv sync --frozen --project services/user-service
      - run: uv sync --frozen --project services/menu-service
      - run: uv sync --frozen --project services/order-service
      - run: python infra/run-service-integration.py
      - run: python -m unittest discover -s tests/smoke -v
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
