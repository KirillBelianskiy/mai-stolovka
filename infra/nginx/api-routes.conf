location = /api/v1/users/auth/staff {
    limit_req zone=staff_login burst=10 nodelay;
    proxy_pass http://user-service:8000/auth/staff;
    proxy_set_header Host $host;
}
location = /api/v1/users { return 308 /api/v1/users/; }
location /api/v1/users/ {
    proxy_pass http://user-service:8000/;
    proxy_set_header Host $host;
}
location = /api/v1/menu { return 308 /api/v1/menu/; }
location /api/v1/menu/ {
    proxy_pass http://menu-service:8000/;
    proxy_set_header Host $host;
}
location = /api/v1/orders { proxy_pass http://order-service:8000/; }
location /api/v1/orders/ {
    proxy_pass http://order-service:8000/;
    proxy_set_header Host $host;
}
location /health/user/ {
    proxy_pass http://user-service:8000/health/;
}
location /health/menu/ {
    proxy_pass http://menu-service:8000/health/;
}
location /health/order/ {
    proxy_pass http://order-service:8000/health/;
}
location /health/notification/ {
    proxy_pass http://notification-service:8000/health/;
}
location /health/websocket/ {
    proxy_pass http://websocket-service:8000/health/;
}
location = /api/v1/ws/kitchen {
    proxy_pass http://websocket-service:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}
