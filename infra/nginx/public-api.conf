# This listener is bound to host loopback only by the Tunnel Compose overlay.
map $http_origin $mai_cors_origin {
    default "";
    "https://maistolovka.me" "https://maistolovka.me";
}
map $request_method $mai_api_method {
    default $request_method;
    OPTIONS $http_access_control_request_method;
}
map "$mai_api_method:$uri" $mai_client_route {
    default 0;
    ~^GET:/api/v1/menu/(categories|items)$ 1;
    "~^GET:/api/v1/menu/items/[0-9a-fA-F-]{36}$" 1;
    ~^POST:/api/v1/users/auth/(telegram|session|logout)$ 1;
    ~^(GET|PATCH):/api/v1/users/me$ 1;
    ~^GET:/api/v1/orders/(slots|wallet)$ 1;
    ~^(GET|POST):/api/v1/orders/$ 1;
    "~^GET:/api/v1/orders/[0-9a-fA-F-]{36}$" 1;
    "~^POST:/api/v1/orders/[0-9a-fA-F-]{36}/cancel$" 1;
}
map "$request_method:$mai_cors_origin" $mai_invalid_preflight {
    default 0;
    "OPTIONS:" 1;
}
# Cloudflare overwrites this header. The host binding trusts local processes only.
map $http_cf_connecting_ip $mai_client_address {
    default $remote_addr;
    ~^[0-9A-Fa-f:.]+$ $http_cf_connecting_ip;
}
server {
    listen 8082;
    server_name api.maistolovka.me;
    client_max_body_size 128k;

    add_header Access-Control-Allow-Origin $mai_cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key" always;
    add_header Access-Control-Expose-Headers "Idempotency-Replayed" always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;

    location / {
        if ($mai_client_route = 0) { return 404; }
        if ($mai_invalid_preflight = 1) { return 403; }
        if ($request_method = OPTIONS) { return 204; }

        # Forward only the normalized, allowlisted path through the existing router.
        proxy_pass http://127.0.0.1:8080$uri$is_args$args;
        proxy_set_header Host api.maistolovka.me;
        proxy_set_header X-MAI-Public-API 1;
        proxy_set_header X-Forwarded-For $mai_client_address;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
    }
}
