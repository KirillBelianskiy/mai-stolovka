worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=staff_login:10m rate=10r/m;
    limit_req_status 429;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        include /etc/nginx/api-routes.conf;
        location / { proxy_pass http://telegram-mini-app:80; }
    }
    server {
        listen 8081;
        include /etc/nginx/api-routes.conf;
        location / { proxy_pass http://kitchen-app:80; }
    }
    server {
        listen 8082 default_server;
        include /etc/nginx/api-routes.conf;
        location / { return 404; }
    }
}
