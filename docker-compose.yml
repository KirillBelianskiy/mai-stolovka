name: mai-stolovka

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: bootstrap_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}
      MENU_DB_PASSWORD: ${MENU_DB_PASSWORD:?Set MENU_DB_PASSWORD in .env}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD in .env}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 15

  user-service:
    build: ./services/user-service
    environment:
      APP_JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:-}
      APP_JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      APP_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_NOTIFICATION_SERVICE_PUBLIC_KEY_BASE64: ${NOTIFICATION_SERVICE_PUBLIC_KEY_BASE64:-}
      APP_TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_DATABASE_URL: postgresql+asyncpg://users_owner:${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}@postgres:5432/users_db
    depends_on:
      postgres:
        condition: service_healthy

  menu-service:
    build: ./services/menu-service
    environment:
      APP_JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_DATABASE_URL: postgresql+asyncpg://menu_owner:${MENU_DB_PASSWORD:?Set MENU_DB_PASSWORD in .env}@postgres:5432/menu_db
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    environment:
      APP_JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      APP_MENU_BASE_URL: http://menu-service:8000
      APP_DEMO_PAYMENTS_ENABLED: ${ORDER_DEMO_PAYMENTS_ENABLED:-false}
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_DATABASE_URL: postgresql+asyncpg://orders_owner:${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD in .env}@postgres:5432/orders_db
    depends_on:
      postgres:
        condition: service_healthy

  outbox-worker:
    profiles: [outbox]
    build: ./services/order-service
    command: ["/app/.venv/bin/python", "-m", "order_service.outbox"]
    environment:
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_DATABASE_URL: postgresql+asyncpg://orders_owner:${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD in .env}@postgres:5432/orders_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # The HTTP image's readiness probe does not describe the standalone worker.
    healthcheck:
      disable: true
    restart: "no"
    stop_grace_period: 60s

  notification-service:
    build: ./services/notification-service
    environment:
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_DATABASE_URL: postgresql+asyncpg://notifications_owner:${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}@postgres:5432/notifications_db
    depends_on:
      kafka:
        condition: service_healthy

  notification-inbox:
    profiles: [inbox]
    build: ./services/notification-service
    command: ["/app/.venv/bin/python", "-m", "notification_service.ingest"]
    environment:
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_DATABASE_URL: postgresql+asyncpg://notifications_owner:${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}@postgres:5432/notifications_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    stop_grace_period: 30s

  websocket-service:
    build: ./services/websocket-service
    environment:
      APP_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  telegram-mini-app:
    build:
      context: .
      dockerfile: apps/telegram-mini-app/Dockerfile

  kitchen-app:
    build:
      context: .
      dockerfile: apps/kitchen-app/Dockerfile

  proxy:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:${MINI_APP_PORT:-8080}:8080"
      - "127.0.0.1:${KITCHEN_APP_PORT:-8081}:8081"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/api-routes.conf:/etc/nginx/api-routes.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      websocket-service:
        condition: service_healthy
      telegram-mini-app:
        condition: service_healthy
      kitchen-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  kafka-data:
