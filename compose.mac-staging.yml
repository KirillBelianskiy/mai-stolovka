services:
  postgres:
    ports: !reset []
  kafka:
    ports: !reset []
    environment:
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

  user-service:
    environment:
      APP_SESSION_COOKIE_ALLOWED_ORIGINS: ${STAGING_CUSTOMER_ORIGIN:?Set the staging customer origin}
  websocket-service:
    environment:
      APP_JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Initialize staging JWT keys}
      APP_KITCHEN_KAFKA_ENABLED: ${STAGING_KITCHEN_KAFKA_ENABLED:-false}
      APP_KITCHEN_KAFKA_TOPIC: orders.events.v1
      APP_KITCHEN_KAFKA_GROUP: kitchen-orders-v1
      APP_ALLOWED_ORIGINS: ${STAGING_KITCHEN_ORIGIN:?Set the staging kitchen origin}

  telegram-mini-app:
    profiles: [local-development-only]
  kitchen-app:
    profiles: [local-development-only]
  proxy:
    profiles: [local-development-only]
    ports: !reset []

  customer-role:
    build: ./services/user-service
    entrypoint: ["/app/.venv/bin/uvicorn"]
    command:
      - customer_role:create_app
      - --factory
      - --app-dir
      - /staging
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
      - --no-access-log
    environment:
      APP_JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Initialize staging JWT keys}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./infra/mac-staging/customer_role.py:/staging/customer_role.py:ro
    healthcheck:
      # An unauthenticated response confirms that the verifier started.
      test: ["CMD", "/app/.venv/bin/python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); c.request('GET', '/client'); assert c.getresponse().status == 401"]

  staging-ingress:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:18280:8080"
      - "127.0.0.1:18281:8081"
    environment:
      STAGING_WEBHOOK_ENABLED: ${STAGING_WEBHOOK_ENABLED:-false}
    volumes:
      - ./infra/mac-staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.private/mac-staging/artifacts:/srv:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8081/
      interval: 5s
      timeout: 4s
      retries: 10
    depends_on:
      customer-role:
        condition: service_healthy
      user-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      websocket-service:
        condition: service_healthy
